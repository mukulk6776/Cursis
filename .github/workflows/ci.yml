name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Code Quality (ESLint)
        run: npm run lint

      - name: Verify Strict TypeScript Compilation
        run: npm run typecheck

      - name: Execute Regression & Integration Test Suites
        run: npm test

      - name: Production Build Check
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://cursis.in
          NODE_ENV: production
